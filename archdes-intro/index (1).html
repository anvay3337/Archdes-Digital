<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Archdes Digital — Web. Design. Reimagined.</title>
<link rel="icon" type="image/png" href="../client/assets/archdes-logo.png">
<link rel="shortcut icon" type="image/png" href="../client/assets/archdes-logo.png">
<link rel="apple-touch-icon" href="../client/assets/archdes-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Sora:wght@500;700;800&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#1f3dff;--deep:#030720;--ice:#cfe4ff;--glow:#5b86ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:Manrope,system-ui,sans-serif}
#cam{position:fixed;inset:0;overflow:hidden;background:var(--deep)}
#cam>*{position:absolute}
#bg,#tech,#liq{inset:0;width:100%;height:100%}
#bg{background-color:var(--deep)}
#liq{filter:url(#goo)}
#tech{opacity:0;background:radial-gradient(circle at 50% 42%,rgba(42,70,255,.5),transparent 55%);overflow:hidden}
#tech::before{content:"";position:absolute;left:-20%;right:-20%;bottom:0;height:55%;background:linear-gradient(rgba(91,134,255,.38) 1px,transparent 1px) 0 0/7vmin 7vmin,linear-gradient(90deg,rgba(91,134,255,.38) 1px,transparent 1px) 0 0/7vmin 7vmin;transform:perspective(500px) rotateX(62deg);transform-origin:bottom;-webkit-mask-image:linear-gradient(transparent,#000);mask-image:linear-gradient(transparent,#000);animation:gm 1.6s linear infinite}
@keyframes gm{to{background-position:0 7vmin,7vmin 0}}

/* kinetic words */
.w{inset:0;display:grid;place-items:center;font:400 14vw/1 'Archivo Black',Impact,sans-serif;letter-spacing:-.035em;opacity:0;white-space:nowrap;will-change:transform,clip-path}
.w i{font-style:normal}#w1 i{color:#030720}#w2 i{color:var(--blue)}#w3 i{color:#5b86ff}
.brush{left:-10vw;top:50%;width:120vw;height:42vh;transform:translateY(-50%);opacity:0;pointer-events:none}
.brush path{fill:none;stroke:var(--blue);stroke-width:150;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;will-change:stroke-dashoffset}
.ring{display:none!important;opacity:0!important;visibility:hidden!important}

/* 3D desktop */
.scene{inset:0;display:grid;place-items:center;padding-bottom:4vh;perspective:1500px;visibility:hidden}
.rig{position:relative;width:min(76vw,90vh);transform-style:preserve-3d;transform-origin:50% 40%}
.bezel{position:relative;container-type:inline-size;aspect-ratio:16/10;border-radius:2.4%;background:#0a1030;border:1.1vmin solid #121c5c;box-shadow:0 0 0 1px rgba(91,134,255,.6),0 0 9vmin rgba(42,70,255,.75),0 4vmin 8vmin rgba(0,0,0,.6)}
.neck{width:9%;height:12vmin;margin:0 auto;background:linear-gradient(90deg,#0a1030,#1d2a80,#0a1030)}
.base{width:32%;height:1.6vmin;margin:0 auto;border-radius:99px;background:linear-gradient(90deg,#0a1030,#2a46ff,#0a1030);box-shadow:0 0 4vmin rgba(42,70,255,.8)}
.screen{position:absolute;inset:0;overflow:hidden;border-radius:1.4cqw;background:linear-gradient(160deg,#0b1550,#050a30);font:700 2.1cqw/1.3 Manrope,sans-serif;color:#dbe7ff}
.chrome{display:flex;align-items:center;gap:.5em;padding:.7em 1em;background:#0a1240;border-bottom:1px solid rgba(42,70,255,.5)}
.chrome i{width:.8em;height:.8em;border-radius:50%;background:#5b86ff}
.chrome b{margin-left:1em;padding:.2em 1em;border-radius:99px;background:#050a30;font-weight:500;color:#8fa8ff;white-space:nowrap;overflow:hidden;width:0;padding:.2em 0}
.m-nav{position:relative;display:flex;justify-content:space-between;align-items:center;padding:.8em 3em;background:#07103f;z-index:2;font-weight:800}
.m-nav span{color:#8fa8ff;font-weight:500;margin-right:2em}
.m-btn{display:inline-block;padding:.5em 1.3em;border-radius:99px;background:#2a46ff;color:#fff}
.scroll{padding:3em;display:grid;gap:3em}
.m-hero small{color:#5b86ff;letter-spacing:.2em;font-size:.8em}
.m-hero h3{max-width:12ch;margin:.3em 0 .6em;font:800 3.6em/1 Syne,sans-serif;background:linear-gradient(100deg,#fff 30%,#5b86ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.m-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2em}
.m-cards div{aspect-ratio:1.2;border-radius:1em;border:1px solid rgba(42,70,255,.5);background:radial-gradient(circle at 70% 20%,rgba(91,134,255,.6),transparent 60%),#0d1a66}
.m-chart{display:flex;align-items:flex-end;gap:.8em;height:9em}.m-chart i{flex:1;height:var(--h);border-radius:.4em .4em 0 0;background:linear-gradient(#5b86ff,#2a46ff)}
.cur{position:absolute;left:0;top:0;width:3.2cqw;z-index:5;filter:drop-shadow(0 0 .6cqw #5b86ff)}
.glare{position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.14) 50%,transparent 60%);background-size:250% 100%;background-position:120% 0}
.chip,.orbit{position:absolute}
.chip{padding:.6em 1.1em;border:1px solid rgba(91,134,255,.8);border-radius:12px;background:rgba(10,18,64,.75);backdrop-filter:blur(6px);color:var(--ice);font:700 clamp(.7rem,1.6vw,1rem) Manrope,sans-serif;box-shadow:0 0 24px rgba(42,70,255,.55);opacity:0}
.c1{top:-4%;left:-10%;transform:translateZ(90px)}.c2{top:14%;right:-12%;transform:translateZ(120px)}.c3{bottom:26%;left:-12%;transform:translateZ(110px)}.c4{bottom:12%;right:-8%;transform:translateZ(80px)}
.orbit{left:50%;top:40%;width:135%;aspect-ratio:1;border:1.5px solid rgba(91,134,255,.7);border-radius:50%;opacity:0}
.orbit::after{content:"";position:absolute;left:50%;top:-5px;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 18px 4px var(--glow)}

/* logo */
.logo{inset:0;display:grid;place-items:center;visibility:hidden}
.lock{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:.5em;font-size:clamp(1.6rem,6.4vw,6rem);color:#fff;white-space:nowrap}
.mark{flex:none;filter:drop-shadow(0 0 .35em rgba(40,120,255,.6))}
.mark img{clip-path:inset(100% 0 0 0)}
.mark img{display:block;height:2.6em;width:auto}
.txt{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:.16em}
.word{display:flex;overflow:hidden;padding:.04em .02em;font:800 1em/1 Sora,'Plus Jakarta Sans',Arial,sans-serif;letter-spacing:.01em;text-shadow:none}
.word span{display:inline-block;will-change:transform}
.sub{margin:0;padding:0 .02em;font:800 .88em/1 Sora,'Plus Jakarta Sans',Arial,sans-serif;letter-spacing:.075em;color:#fff;opacity:0;text-align:left;align-self:flex-start;white-space:nowrap}
.shock{left:50%;top:44%;width:30vmin;height:30vmin;margin:-15vmin;border:3px solid #fff;border-radius:50%;opacity:0}

/* film look */
.flash{inset:0;background:#fff;opacity:0;pointer-events:none}
.grain{inset:-50%;pointer-events:none;opacity:.1;mix-blend-mode:overlay;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:gr .5s steps(6) infinite}
@keyframes gr{0%{transform:translate(0,0)}20%{transform:translate(-4%,3%)}40%{transform:translate(3%,-5%)}60%{transform:translate(-6%,-2%)}80%{transform:translate(5%,4%)}100%{transform:translate(0,0)}}
.scratch{inset:0;pointer-events:none;opacity:.5;background:linear-gradient(90deg,transparent 0 12%,rgba(255,255,255,.55) 12% 12.1%,transparent 12.1% 61%,rgba(255,255,255,.4) 61% 61.07%,transparent 61.07%);animation:sc .6s steps(1) infinite}
@keyframes sc{0%{background-position:0 0}25%{background-position:23vw 0}50%{background-position:-17vw 0}75%{background-position:9vw 0}}
.vig{inset:0;pointer-events:none;background:radial-gradient(circle,transparent 55%,rgba(0,0,0,.55))}
.hud{font:700 .72rem Manrope,sans-serif;letter-spacing:.25em;color:var(--ice);opacity:.85;z-index:9}
#h1{left:4vw;top:4vh}#h2{right:4vw;top:4vh}
#bar{left:0;bottom:0;height:3px;width:100%;background:var(--ice);transform:scaleX(0);transform-origin:left;z-index:9}
#replay{position:fixed;right:4vw;bottom:5vh;z-index:10;padding:.7rem 1.4rem;border:1px solid #fff;border-radius:99px;background:rgba(3,7,32,.5);color:#fff;font:700 .9rem Manrope,sans-serif;cursor:pointer;opacity:0;visibility:hidden;backdrop-filter:blur(6px)}
#replay:hover{background:rgba(255,255,255,.2)}

/* SMART NETWORK PRELOADER */
#netLoader {
  position: fixed; inset: 0; z-index: 9999999; background: #000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1.8rem; opacity: 1; pointer-events: auto; visibility: visible;
  transition: opacity .55s cubic-bezier(.16,1,.3,1), visibility .55s;
}
#netLoader.hidden { opacity: 0 !important; pointer-events: none !important; visibility: hidden !important; }
.loader-thrust-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.loader-rocket-group { position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; will-change: transform; }
.loader-thrust-beam {
  position: absolute; top: 92%; left: 50%; transform: translateX(-50%); width: 12px; height: 0;
  border-radius: 99px; background: linear-gradient(180deg, #ffffff 0%, #00d2ff 25%, #1f3dff 60%, transparent 100%);
  filter: blur(1.5px) drop-shadow(0 0 16px #1f3dff) drop-shadow(0 0 24px #00d2ff);
  opacity: 0; pointer-events: none; transition: height 0.15s ease-out, opacity 0.15s ease-out;
}
.loader-glow-wrapper { position: relative; width: 140px; height: 140px; display: grid; place-items: center; }
.loader-circular-ring {
  position: absolute; inset: 0; border-radius: 50%; padding: 3.5px;
  background: conic-gradient(from 0deg, transparent 0%, transparent 20%, #1f3dff 65%, #5b86ff 85%, #fff 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  animation: loader-spin 1.25s linear infinite;
  filter: drop-shadow(0 0 14px rgba(31,61,255,.9)) drop-shadow(0 0 28px rgba(91,134,255,.6));
}
.loader-glow-aura {
  position: absolute; inset: -12px; border-radius: 50%;
  background: radial-gradient(circle, rgba(31,61,255,.3) 0%, transparent 70%);
  animation: loader-aura-pulse 2s ease-in-out infinite alternate; pointer-events: none;
}
.loader-logo-core { position: relative; width: 68px; height: 68px; display: grid; place-items: center; z-index: 2; }
.loader-logo-core img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 12px rgba(91,134,255,.85)); animation: loader-logo-breathe 2s ease-in-out infinite alternate; }
.loader-caption { font-family: Manrope, system-ui, sans-serif; font-size: .75rem; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; color: #8fa8ff; opacity: .85; display: flex; align-items: center; gap: .6em; }
.loader-dots span { animation: loader-dot-blink 1.4s infinite both; }
.loader-dots span:nth-child(2) { animation-delay: .2s; }
.loader-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes loader-spin { to { transform: rotate(360deg); } }
@keyframes loader-aura-pulse { 0% { transform: scale(.92); opacity: .35; } 100% { transform: scale(1.18); opacity: .8; } }
@keyframes loader-logo-breathe { 0% { transform: scale(.96); filter: drop-shadow(0 0 8px rgba(31,61,255,.6)); } 100% { transform: scale(1.05); filter: drop-shadow(0 0 20px rgba(91,134,255,.95)); } }
@keyframes loader-dot-blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
</style>
</head>

  requestAnimationFrame(draw);
  if (!ctx) return;
  ctx.clearRect(0, 0, W, H);
  if (fl.p <= 0) return;
  const R = Math.hypot(W, H), x0 = fl.ox * W, y0 = fl.oy * H, p = fl.p;
  ctx.fillStyle = fl.color;
  if (p >= .999) { ctx.fillRect(0, 0, W, H); return; }
  seeds.forEach(s => {
    const wob = Math.sin(t / 1000 * s.f + s.a) * 14 * p;
    ctx.beginPath();
    ctx.arc(x0 + Math.cos(s.a) * R * p * s.d * .55, y0 + Math.sin(s.a) * R * p * s.d * .55, R * p * s.r * .62 + wob, 0, 6.283);
    ctx.fill();
  });
})(0);
function flood(tl, t, color, ox, oy, dur = .6) {
  tl.set(fl, { color, ox, oy, p: 0 }, t)
    .to(fl, { p: 1, duration: dur, ease: 'power2.inOut' }, t)
    .set(bg, { backgroundColor: color }, t + dur)
    .set(fl, { p: 0 }, t + dur + .02);
}
const glitchOld = el => gsap.timeline().to(el, { '--gx': '.05em', duration: .04 }).to(el, { '--gx': '-.045em', duration: .04 })
  .to(el, { '--gx': '.02em', duration: .04 }).to(el, { '--gx': '0em', duration: .07 });
const glitch = () => gsap.timeline();
const shake = a => gsap.timeline().to(cam, { scale: 1 + a / 1500, duration: .22, ease: 'sine.out' }).to(cam, { scale: 1, duration: .7, ease: 'sine.inOut' });
const shakeOld = a => gsap.timeline().to(cam, { x: a, y: -a * .6, duration: .04 }).to(cam, { x: -a, y: a * .5, duration: .04 })
  .to(cam, { x: a * .5, y: a * .3, duration: .04 }).to(cam, { x: 0, y: 0, duration: .09 });

/* letters for the logo wordmark */
'ARCHDES'.split('').forEach(c => { const s = document.createElement('span'); s.textContent = c; $('word').appendChild(s); });
const letters = $('word').children;

/* ---------- master timeline (~11s) ---------- */
const tl = gsap.timeline({ paused: true, onUpdate() {
  $('bar').style.transform = `scaleX(${tl.progress()})`;
  $('h2').textContent = '00:' + String(Math.floor(tl.time())).padStart(2, '0');
}, onComplete() { gsap.to('#replay', { autoAlpha: 1, duration: .6 }); } });

// liquid floods: 1st Pink, 2nd White, 3rd Blue
flood(tl, .1, PINK, .1, .9, .9);
flood(tl, 1.65, WHITE, .95, .2, .85);
flood(tl, 3.05, BLUE, .5, 0, .85);
tl.to('#bg', { backgroundColor: DEEP, duration: .9, ease: 'sine.inOut' }, 3.8);
tl.to('#tech', { opacity: 1, duration: .9, ease: 'sine.inOut' }, 3.5);

// WEB. (White on Pink) / DESIGN. (Navy on White) / REIMAGINED. (White on Blue)
function reveal(id, color, tIn, tOut) {
  tl.fromTo(id, { opacity: 1, color, yPercent: 45, scale: 1.14, clipPath: 'inset(0 0 100% 0)' },
    { yPercent: 0, scale: 1, clipPath: 'inset(0 0 0% 0)', duration: 1, ease: 'expo.out' }, tIn)
    .to(id, { yPercent: -45, scale: .97, clipPath: 'inset(100% 0 0 0)', duration: .65, ease: 'power3.inOut' }, tOut);
}
reveal('#w1', WHITE, .75, 1.75);
reveal('#w2', DARK_NAVY, 2.25, 3.2);
tl.add(shake(10), .75).add(shake(10), 2.25);

tl.set('.brush', { opacity: 1 }, 3.6)
  .to('.brush path', { strokeDashoffset: 0, duration: .8, ease: 'power2.inOut' }, 3.6)
  .fromTo('#w3', { opacity: 1, color: '#FFFFFF', yPercent: 45, scale: 1.14, clipPath: 'inset(0 0 100% 0)' },
    { yPercent: 0, scale: 1, clipPath: 'inset(0 0 0% 0)', duration: 1.1, ease: 'expo.out' }, 3.75)
  .add(shake(14), 3.75)
  .to('#w3', { scale: 5, opacity: 0, duration: .75, ease: 'power3.in' }, 5.15)
  .to('.brush', { opacity: 0, scaleY: 2.5, duration: .6, ease: 'power2.in' }, 5.15);

// desktop + logo sequence lives in its own timeline, offset so the longer title beats fit
const t2 = gsap.timeline();
// desktop punches in
t2.set('.scene', { visibility: 'visible' }, 3.9)
  .fromTo('#rig', { y: () => innerHeight * .7, rotationY: -75, rotationX: 28, scale: .55, opacity: 0 },
    { y: 0, rotationY: -26, rotationX: 10, scale: 1, opacity: 1, duration: .95, ease: 'expo.out' }, 3.9)
  .add(shake(12), 4.15)
  .to('#rig', { rotationY: 16, rotationX: 4, duration: 2.2, ease: 'sine.inOut' }, 4.85)
  .fromTo('.chip', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: .5, ease: 'back.out(2)', stagger: .12 }, 4.3)
  .to('.chip', { y: '-=14', duration: 1.2, ease: 'sine.inOut', yoyo: true, repeat: 3, stagger: .15 }, 4.8)
  .set('#o1,#o2', { xPercent: -50, yPercent: -50, rotationX: 72 }, 3.9)
  .fromTo('#o1', { rotation: 0, opacity: 0 }, { rotation: 360, opacity: 1, duration: 3.2, ease: 'none' }, 4.2)
  .fromTo('#o2', { rotation: 90, opacity: 0, scale: .75 }, { rotation: -270, opacity: 1, duration: 3.2, ease: 'none' }, 4.3)
  // website on the screen comes alive
  .to('#url', { width: '40%', padding: '.2em 1em', duration: .8, ease: 'steps(15)' }, 4.5)
  .to('#scroll', { y: () => { const sc = $('scroll'); return sc ? -sc.scrollHeight * .42 : -100; }, duration: 1.4, ease: 'power2.inOut' }, 4.9)
  .to('#glare', { backgroundPosition: '-60% 0', duration: 1.4, ease: 'power1.inOut' }, 4.6)
  .to('#scroll', { y: 0, duration: .6, ease: 'power2.inOut' }, 6.4)
  // cursor glides to the button and clicks with safe parent bounds
  .fromTo('#cur', {
    x: () => { const sc = $('screen'); return sc ? sc.offsetWidth * .25 : 50; },
    y: () => { const sc = $('screen'); return sc ? sc.offsetHeight * .85 : 150; },
    opacity: 0
  }, {
    x: () => {
      const cta = $('cta');
      return cta && cta.offsetParent ? cta.offsetParent.offsetLeft + cta.offsetLeft + cta.offsetWidth * .5 : 100;
    },
    y: () => {
      const cta = $('cta');
      return cta && cta.offsetParent ? cta.offsetParent.offsetTop + cta.offsetTop + cta.offsetHeight * .5 : 40;
    },
    opacity: 1, duration: 1.2, ease: 'power3.inOut'
  }, 5.5)
  .to('#cta', { scale: .88, duration: .08, yoyo: true, repeat: 1, background: '#fff', color: '#1f3dff' }, 6.75)
  .to('#cur', { scale: .8, duration: .08, yoyo: true, repeat: 1 }, 6.75);

// camera dives into the screen -> flash cut
t2.to('#rig', { rotationY: 0, rotationX: 0, scale: 9, duration: 1.0, ease: 'power3.in' }, 7.0)
  .to(cam, { filter: 'blur(3px) saturate(1.6)', duration: 1, ease: 'power2.in' }, 7.0)
  .fromTo('#flash', { opacity: 0 }, { opacity: 1, duration: .22, ease: 'sine.in' }, 7.8)
  .set('.scene', { visibility: 'hidden' }, 8.03)
  .set(cam, { filter: 'none' }, 8.03)
  .set('#tech', { opacity: 1 }, 8.03)
  .set('#logo', { visibility: 'visible' }, 8.03)
  .to('#flash', { opacity: 0, duration: .8, ease: 'sine.out' }, 8.06);

// logo reveal: mark rises in, ring blooms, wordmark lifts letter by letter, DIGITAL tracks in
t2.fromTo('#logoimg', { clipPath: 'inset(100% -40% 0 -40%)' }, { clipPath: 'inset(-40% -40% -40% -40%)', duration: 1.4, ease: 'expo.inOut' }, 8.1)
  .fromTo('#mark', { scale: .85, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.4, ease: 'expo.inOut' }, 8.1)
  .fromTo('#shock', { scale: .2, opacity: .8, immediateRender: false }, { scale: 6, opacity: 0, duration: 1.8, ease: 'power2.out', immediateRender: false }, 8.9)
  .fromTo(letters, { yPercent: 115, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 1.1, ease: 'power4.out', stagger: .06 }, 8.85)
  .add(shake(8), 9.0)
  .fromTo('#sub', { opacity: 0, yPercent: 40, letterSpacing: '0.2em' }, { opacity: 1, yPercent: 0, letterSpacing: '0.075em', duration: 1.2, ease: 'expo.out' }, 9.3)
  .to('#mark', { filter: 'drop-shadow(0 0 .65em rgba(70,150,255,.95))', duration: 1, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 9.6)
  .to({}, { duration: .6 }, 11.2);
tl.add(t2, 1.5);

window.tl = tl;
function fit() {
  document.querySelectorAll('.w').forEach(w => {
    const sp = w.firstElementChild;
    if (!sp) return;
    w.style.fontSize = '100px';
    const k = Math.min(innerWidth * .88 / sp.getBoundingClientRect().width, innerHeight * .46 / 100);
    w.style.fontSize = (100 * k) + 'px';
  });
}
window.addEventListener('resize', fit);

const navmark = $('navmark'), logoimg = $('logoimg');
if (navmark && logoimg && logoimg.src) {
  navmark.src = logoimg.src;
}

const replayBtn = $('replay');
if (replayBtn) {
  replayBtn.addEventListener('click', () => {
    tl.seek(0).play();
    gsap.to('#replay', { autoAlpha: 0, duration: 0.3 });
  });
}

function getFlag(k) {
  try { return typeof window !== 'undefined' && window.sessionStorage ? sessionStorage.getItem(k) : null; } catch (e) { return null; }
}
function setFlag(k, v) {
  try { if (typeof window !== 'undefined' && window.sessionStorage) sessionStorage.setItem(k, v); } catch (e) {}
}

const loaderEl = $('netLoader');

function triggerRocketLaunchTransition(onComplete) {
  const rocket = $('loaderRocketGroup');
  const canvas = $('loaderThrustCanvas');
  const caption = $('loaderCaption');
  const beam = $('loaderThrustBeam');

  if (!rocket || !loaderEl) {
    if (loaderEl) loaderEl.style.display = 'none';
    onComplete();
    return;
  }

  if (caption) {
    caption.style.transition = 'opacity 0.25s ease';
    caption.style.opacity = '0';
  }

  let ctx = null;
  const W = window.innerWidth, H = window.innerHeight;
  if (canvas) {
    canvas.width = W; canvas.height = H;
    ctx = canvas.getContext('2d');
  }

  const sparks = [];
  const sparkColors = ['#ffffff', '#8fa8ff', '#1f3dff', '#00d2ff', '#FF2E93', '#c084fc'];
  let isEmitting = true, animId = null;

  function spawnSparks(x, y, count) {
    for (let i = 0; i < count; i++) {
      const spread = (Math.random() - 0.5) * 1.3;
      const speed = 7 + Math.random() * 22;
      sparks.push({
        x: x + (Math.random() - 0.5) * 24,
        y: y + Math.random() * 8,
        vx: spread * speed * 0.45,
        vy: Math.abs(speed) + 5,
        size: 1.5 + Math.random() * 3.5,
        color: sparkColors[Math.floor(Math.random() * sparkColors.length)],
        alpha: 1,
        decay: 0.02 + Math.random() * 0.045
      });
    }
  }

  const rumbleStart = Date.now();
  function rumble() {
    if (Date.now() - rumbleStart < 180) {
      const rx = (Math.random() - 0.5) * 4;
      const ry = (Math.random() - 0.5) * 4;
      rocket.style.transform = 'translate(' + rx + 'px, ' + ry + 'px)';
      if (beam) {
        beam.style.height = (25 + Math.random() * 25) + 'px';
        beam.style.opacity = '0.85';
      }
      requestAnimationFrame(rumble);
    } else {
      takeoff();
    }
  }

  function takeoff() {
    if (beam) {
      beam.style.height = '150px';
      beam.style.opacity = '1';
    }
    rocket.style.transition = 'transform 0.82s cubic-bezier(0.55, 0, 0.85, 0.2)';
    rocket.style.transform = 'translateY(-' + (H + 300) + 'px) scale(1.15)';

    setTimeout(() => {
      loaderEl.style.transition = 'opacity 0.45s ease';
      loaderEl.style.opacity = '0';
    }, 420);

    setTimeout(() => {
      isEmitting = false;
      setTimeout(() => {
        if (animId) cancelAnimationFrame(animId);
        loaderEl.style.display = 'none';
        onComplete();
      }, 220);
    }, 780);
  }

  function loop() {
    if (ctx) {
      ctx.clearRect(0, 0, W, H);
      const rect = rocket.getBoundingClientRect();
      const nozzleX = rect.left + rect.width / 2;
      const nozzleY = rect.bottom - 8;
      if (isEmitting && nozzleY > -60) spawnSparks(nozzleX, nozzleY, 8);

      ctx.save();
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.x += s.vx; s.y += s.vy; s.vy += 0.38; s.alpha -= s.decay;
        if (s.alpha <= 0) { sparks.splice(i, 1); continue; }
        ctx.globalAlpha = Math.max(0, s.alpha);
        ctx.fillStyle = s.color;
        ctx.shadowColor = s.color;
        ctx.shadowBlur = 9;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    animId = requestAnimationFrame(loop);
  }

  rumble();
  loop();
}

function completeLoadingAndPlay(onReady) {
  const hasSeen = getFlag('archdes_intro_v2_seen');
  if (!hasSeen && loaderEl && loaderEl.style.display !== 'none') {
    setFlag('archdes_intro_v2_seen', '1');
    const start = window.__archdesIntroStart || Date.now();
    const elapsed = Date.now() - start;
    const targetDuration = 3000;
    const waitTime = Math.max(0, targetDuration - elapsed);
    setTimeout(() => {
      triggerRocketLaunchTransition(onReady);
    }, waitTime);
  } else {
    if (loaderEl) loaderEl.style.display = 'none';
    setFlag('archdes_intro_v2_seen', '1');
    onReady();
  }
}

function start() {
  fit();
  if (loaderEl && $('loaderimg') && logoimg) $('loaderimg').src = logoimg.src;
  completeLoadingAndPlay(() => {
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => { fit(); setTimeout(() => tl.play(0), 100); });
    } else {
      setTimeout(() => tl.play(0), 100);
    }
  });
}

if (document.readyState === 'loading') {
  window.addEventListener('DOMContentLoaded', start);
} else {
  start();
}
</script>
